# Push a tag like v0.1.0 to build a signed APK and a Windows MSI installer and attach them to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Windows runner: the MSI can only be built on Windows, and it has the Android SDK too.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and publish
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          export ANDROID_KEYSTORE_PATH=release.jks
          export APP_VERSION="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          # gradle.properties pins a local JDK path; point Gradle at the runner's JDK instead.
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :androidApp:assembleRelease :composeApp:packageMsi
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "Lagerplaner-$APP_VERSION.apk"
          gh release create "$GITHUB_REF_NAME" --title "Lagerplaner $APP_VERSION" --generate-notes \
            "Lagerplaner-$APP_VERSION.apk" composeApp/build/compose/binaries/main/msi/*.msi
